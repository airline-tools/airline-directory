<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f9;color:#172033;font-family:Segoe UI,Tahoma,Arial,sans-serif}
.wrap{max-width:1080px;margin:auto;padding:28px 16px 50px}
.hero{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;padding:28px;border-radius:20px;box-shadow:0 12px 35px #0002}
h1{margin:0 0 5px;font-size:30px} .sub{opacity:.82}
.search{display:flex;gap:10px;margin-top:22px}
input{flex:1;border:0;border-radius:12px;padding:16px;font-size:16px;outline:0}
button{border:0;border-radius:12px;padding:0 22px;font-weight:700;cursor:pointer}
.meta{display:flex;justify-content:space-between;color:#697386;font-size:14px;margin:18px 2px 12px}
.card{background:#fff;border:1px solid #e3e7ee;border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 4px 15px #00000008}
.top{display:flex;justify-content:space-between;gap:15px}
.name{font-size:20px;font-weight:800} .arabic{color:#697386;margin-top:5px}
.code{background:#eef4ff;color:#1d4ed8;border-radius:9px;padding:7px 10px;font-weight:800;height:max-content}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.field{border-top:1px solid #edf0f4;padding-top:11px}
.label{font-size:11px;font-weight:800;letter-spacing:.08em;color:#8a94a6;text-transform:uppercase;margin-bottom:6px}
.value{font-size:14px;line-height:1.65;word-break:break-word}
.emails{display:grid;gap:4px}
.emails a{color:#1d4ed8;text-decoration:none}
.empty{background:#fff;padding:40px;text-align:center;border-radius:16px;color:#697386}
@media(max-width:700px){.search{flex-direction:column}button{height:48px}.grid{grid-template-columns:1fr}.top{flex-direction:column}}
</style>
</head>

'MAA':'Chennai;Madras;مدراس;تشيناي','BOM':'Mumbai;Bombay;بومباي;مومباي','BLR':'Bangalore;Bengaluru;بنغالور;بنغالورو','CCU':'Kolkata;Calcutta;كلكتا;كولكاتا','COK':'Kochi;Cochin;كوتشي;كوتشين','GOI':'Goa;Dabolim;جوا','DPS':'Bali;Denpasar;بالي;دينباسار','DEL':'Delhi;New Delhi;دلهي;نيودلهي','DXB':'Dubai;دبي','AUH':'Abu Dhabi;أبوظبي','DOH':'Doha;الدوحة','KWI':'Kuwait;Kuwait City;الكويت','CAI':'Cairo;القاهرة','IST':'Istanbul;Constantinople;إسطنبول','JFK':'New York;Kennedy;نيويورك','LHR':'London;Heathrow;لندن','CDG':'Paris;Charles de Gaulle;باريس','FCO':'Rome;Fiumicino;روما','AMS':'Amsterdam;Schiphol;أمستردام','NRT':'Tokyo;Narita;طوكيو','HND':'Tokyo;Haneda;طوكيو','BKK':'Bangkok;بانكوك','SIN':'Singapore;Changi;سنغافورة','KUL':'Kuala Lumpur;KLIA;كوالالمبور','HKG':'Hong Kong;Chek Lap Kok;هونغ كونغ','MNL':'Manila;Ninoy Aquino;مانيلا'};

function norm(x){return String(x??'').toLocaleLowerCase().normalize('NFKC').replace(/[‐‑‒–—]/g,'-').replace(/[إأآٱ]/g,'ا').replace(/[ى]/g,'ي').replace(/[ة]/g,'ه').replace(/[ؤ]/g,'و').replace(/[ئ]/g,'ي').replace(/[ء]/g,'').replace(/ـ/g,'').replace(/\s+/g,' ').trim()}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function emailHtml(x){return String(x||'').split(/\s*(?:\/|;|,)\s*/).filter(Boolean).map(e=>'<a href="mailto:'+encodeURIComponent(e)+'">'+esc(e)+'</a>').join('')}
function scoreObj(r,t){let fields=r._type==='airline'?[r['Airline Code'],r['Airline Name'],r['Arabic Name'],r['Search Keywords'],r['Phone'],r['Reissue Code']]:[r.IATA,r.Name,r.ArabicName,r.City,r.CityArabic,r.Country,r.CountryArabic,r.Keywords,r.ArabicKeywords,r.ISO];let s=0;fields.forEach((v,i)=>{v=norm(v);if(v===t)s+=120-i*2;else if(v.startsWith(t))s+=70-i;else if(v.includes(t))s+=25-i});return s}
function parseCSV(text){let rows=[],row=[],cell='',q=false;for(let i=0;i<text.length;i++){let c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else{if(c==='"')q=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else if(c!=='\r')cell+=c}}if(cell!==''||row.length){row.push(cell);rows.push(row)}return rows}
function airportFromRow(h,r){let o={};h.forEach((k,i)=>o[k]=r[i]||'');return o}
function countryName(code,locale='en'){try{return new Intl.DisplayNames([locale],{type:'region'}).of(code)||code}catch(e){return code}}
function buildAirport(a){let city=a.municipality||'';let country=countryName(a.iso_country,'en');let arCity=a.city_ar||CITY_AR[city]||'';let arCountry=a.country_ar||countryName(a.iso_country,'ar');let aliases=SPECIAL_ALIASES[a.iata_code]||'';let arKeywords=a.arabic_keywords||'';let kw=[a.iata_code,a.name,city,country,a.iso_country,aliases,arKeywords].filter(Boolean).join(';');return {_type:'airport',IATA:a.iata_code,Name:a.name,ArabicName:a.arabic_name||('مطار '+(arCity||a.name)),City:city,CityArabic:arCity,Country:country,CountryArabic:arCountry,ISO:a.iso_country,Keywords:kw,ArabicKeywords:arKeywords}}
function loadAirports(){AIRPORTS=AIRPORT_DATA.slice(0,AIRPORT_LIMIT).map(buildAirport);AIRPORTS_READY=true;render()}
const q=document.getElementById('q'); const count=document.getElementById('count'); const out=document.getElementById('results');
function render(){let t=norm(q.value);let combined=[...DB.map(r=>({_type:'airline',r,s:t?scoreObj({...r,_type:'airline'},t):1})),...AIRPORTS.map(r=>({_type:'airport',r,s:t?scoreObj(r,t):1}))].filter(x=>!t||x.s>0).sort((a,b)=>b.s-a.s);count.textContent=t?(combined.length+' result'+(combined.length===1?'':'s')):(DB.length+' airlines'+(AIRPORTS_READY?' + '+AIRPORTS.length+' airports':' + loading airports…'));if(!combined.length){out.innerHTML='<div class="empty">No result found.</div>';return}out.innerHTML=combined.map(x=>{let r=x.r;if(x._type==='airline')return `<article class="card"><div class="top"><div><div class="name">✈️ ${esc(r['Airline Name'])}</div><div class="arabic" dir="rtl">${esc(r['Arabic Name'])}</div></div><div class="code">${esc(r['Airline Code'])}</div></div><div class="grid"><div class="field"><div class="label">Phone</div><div class="value">${esc(r['Phone'])||'—'}</div></div><div class="field"><div class="label">Reissue Code</div><div class="value">${esc(r['Reissue Code'])||'—'}</div></div><div class="field" style="grid-column:1/-1"><div class="label">Email</div><div class="value emails">${emailHtml(r['Email'])||'—'}</div></div><div class="field" style="grid-column:1/-1"><div class="label">Search Keywords</div><div class="value">${esc(r['Search Keywords'])||'—'}</div></div></div></article>`;return `<article class="card"><div class="top"><div><div class="name">🛫 ${esc(r.Name)}</div><div class="arabic" dir="rtl">${esc(r.ArabicName)}</div></div><div class="code">${esc(r.IATA)}</div></div><div class="grid"><div class="field"><div class="label">City</div><div class="value">${esc(r.City)}${r.CityArabic?' — '+esc(r.CityArabic):''}</div></div><div class="field"><div class="label">Country</div><div class="value">${esc(r.Country)}${r.CountryArabic?' — '+esc(r.CountryArabic):''}</div></div><div class="field" style="grid-column:1/-1"><div class="label">Search Keywords</div><div class="value">${esc(r.Keywords)}</div></div></div></article>`}).join('')}
q.addEventListener('input',render);document.getElementById('clear').onclick=()=>{q.value='';q.focus();render()};loadAirports();
</script>
